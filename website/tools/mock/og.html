<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css">
<style>
body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: radial-gradient(900px 500px at 85% 40%, rgba(20,184,166,.16), transparent 60%), #0B0D10; }
.txt { position: absolute; left: 72px; top: 70px; width: 560px; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 720; letter-spacing: -.02em; }
.brand img { width: 46px; height: 46px; }
h1 { margin-top: 64px; font-size: 64px; line-height: 1.04; font-weight: 760; letter-spacing: -.04em; }
h1 span { color: #98A0AA; }
p { margin-top: 26px; font-size: 23px; line-height: 1.45; color: #98A0AA; }
.foot { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 10px; font-size: 17px; font-weight: 600; color: #cfd5db; }
.foot span { padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); }
.foot .a { color: #2DD4BF; border-color: rgba(45,212,191,.35); background: rgba(45,212,191,.08); }
.wall { position: absolute; right: -70px; top: -30px; width: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; transform: rotate(-6deg); }
.wall .cam { aspect-ratio: 16/10; border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,.45); }
.wall .cam .top { font-size: 14px; }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0B0D10 46%, rgba(11,13,16,.0) 64%); pointer-events: none; }
</style></head><body>
