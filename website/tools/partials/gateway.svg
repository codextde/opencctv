<svg viewBox="0 0 560 440" role="img" aria-labelledby="gw-t">
  <title id="gw-t">{{gwTitle}}</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <!-- gateway -->
  <rect x="140.5" y="16.5" width="279" height="80" rx="16" fill="#15201F" stroke="rgba(45,212,191,.45)"/>
  <image href="/assets/mark.svg" x="160" y="38" width="34" height="34"/>
  <text x="206" y="52" font-size="16" font-weight="700" fill="#EEF1F4">{{gwName}}</text>
  <text x="206" y="72" font-size="12" fill="#98A1AC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{{gwWhere}}</text>
  <!-- home network -->
  <rect x="10.5" y="196.5" width="330" height="230" rx="18" fill="none" stroke="rgba(255,255,255,.18)" stroke-dasharray="5 6"/>
  <text x="30" y="226" font-size="12" fill="#69717C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing=".04em">{{home}}</text>
  <rect x="234" y="186" width="96" height="22" rx="11" fill="#0E1114" stroke="rgba(255,255,255,.18)"/>
  <text x="282" y="201" font-size="11" font-weight="600" fill="#98A1AC" text-anchor="middle">{{router}}</text>
  <g font-size="12.5" font-weight="600" fill="#EEF1F4">
    <rect x="30.5" y="244.5" width="90" height="36" rx="9" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="75" y="267" text-anchor="middle">Tapo</text>
    <rect x="130.5" y="244.5" width="90" height="36" rx="9" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="175" y="267" text-anchor="middle">UniFi</text>
    <rect x="230.5" y="244.5" width="90" height="36" rx="9" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="275" y="267" text-anchor="middle">Reolink</text>
  </g>
  <g fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity=".4"><path d="M75 281v34M175 281v34M275 281v34"/></g>
  <rect x="30.5" y="320.5" width="290" height="84" rx="14" fill="#13171B" stroke="rgba(255,255,255,.14)"/>
  <image href="/assets/mark.svg" x="48" y="344" width="32" height="32"/>
  <text x="92" y="357" font-size="15" font-weight="700" fill="#EEF1F4">{{homeServer}}</text>
  <text x="92" y="376" font-size="12" fill="#98A1AC">{{homeServerSub}}</text>
  <!-- phone -->
  <rect x="430.5" y="226.5" width="110" height="200" rx="22" fill="#13171B" stroke="rgba(255,255,255,.18)"/>
  <rect x="466" y="236" width="38" height="9" rx="4.5" fill="#050607"/>
  <rect x="442" y="256" width="86" height="48" rx="7" fill="#1E2A2A"/><rect x="442" y="310" width="41" height="26" rx="5" fill="#1A1F25"/><rect x="487" y="310" width="41" height="26" rx="5" fill="#1A1F25"/><rect x="442" y="340" width="41" height="26" rx="5" fill="#1A1F25"/><rect x="487" y="340" width="41" height="26" rx="5" fill="#1A1F25"/>
  <circle cx="452" cy="266" r="3" fill="#FF5A5F"/>
  <text x="485" y="396" font-size="12.5" font-weight="600" fill="#EEF1F4" text-anchor="middle">{{app}}</text>
  <text x="485" y="413" font-size="11" fill="#98A1AC" text-anchor="middle">{{appWhere}}</text>
  <!-- links -->
  <g fill="none" stroke="#2DD4BF" stroke-width="1.8">
    <path d="M321 352 C 392 352, 380 170, 352 100" marker-end="url(#ag)"/>
    <path d="M485 224 C 485 150, 430 100, 424 72" marker-start="url(#ag)" marker-end="url(#ag)"/>
  </g>
  <g font-size="12" font-weight="600" fill="#2DD4BF">
    <text x="398" y="300" transform="rotate(-90 398 300)">{{tunnel}}</text>
    <text x="478" y="140" text-anchor="end">HTTPS</text>
  </g>
</svg>
