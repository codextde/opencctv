<svg class="v" viewBox="0 0 360 700" role="img" aria-labelledby="flow-v-t">
  <title id="flow-v-t">{{flowTitle}}</title>
  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="srv2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15201F"/><stop offset="1" stop-color="#101416"/></linearGradient>
  </defs>
  <g font-size="11" fill="#69717C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing=".04em">
    <text x="0" y="14">{{cameras}}</text><text x="0" y="214">{{server}}</text><text x="0" y="494">{{storage}}</text><text x="190" y="494">{{devices}}</text>
  </g>
  <g font-size="13.5" font-weight="600" fill="#EEF1F4">
    <rect x=".5" y="26.5" width="169" height="51" rx="11" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="14" y="48">Tapo C210</text><text x="14" y="66" font-size="11" font-weight="500" fill="#98A1AC">RTSP</text>
    <rect x="190.5" y="26.5" width="169" height="51" rx="11" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="204" y="48">UniFi G4 Pro</text><text x="204" y="66" font-size="11" font-weight="500" fill="#98A1AC">Protect · RTSPS</text>
    <rect x=".5" y="86.5" width="169" height="51" rx="11" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="14" y="108">Reolink</text><text x="14" y="126" font-size="11" font-weight="500" fill="#98A1AC">ONVIF · PTZ</text>
    <rect x="190.5" y="86.5" width="169" height="51" rx="11" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="204" y="108">{{pushCam}}</text><text x="204" y="126" font-size="11" font-weight="500" fill="#98A1AC">{{pushCamSub}}</text>
  </g>
  <g fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-opacity=".55">
    <path d="M85 138 C 85 170, 150 170, 150 222" marker-end="url(#av)"/>
    <path d="M275 138 C 275 170, 210 170, 210 222" marker-end="url(#av)"/>
    <path d="M140 450 C 140 475, 85 470, 85 506" marker-end="url(#av)"/>
    <path d="M220 450 C 220 475, 275 470, 275 506" marker-start="url(#av)" marker-end="url(#av)"/>
  </g>
  <rect x=".5" y="226.5" width="359" height="222" rx="16" fill="url(#srv2)" stroke="rgba(45,212,191,.45)"/>
  <image href="/assets/mark.svg" x="18" y="244" width="30" height="30"/>
  <text x="58" y="258" font-size="16" font-weight="700" fill="#EEF1F4">OpenCCTV</text>
  <text x="58" y="274" font-size="11" fill="#98A1AC">Docker · Linux · macOS · Windows</text>
  <g font-size="12.5" font-weight="600" fill="#EEF1F4">
    <rect x="16" y="290" width="328" height="34" rx="9" fill="rgba(255,255,255,.04)"/><text x="28" y="312">go2rtc</text><text x="92" y="312" font-weight="500" fill="#98A1AC">{{go2rtcShort}}</text>
    <rect x="16" y="330" width="328" height="34" rx="9" fill="rgba(255,255,255,.04)"/><text x="28" y="352">ffmpeg</text><text x="92" y="352" font-weight="500" fill="#98A1AC">{{ffmpegShort}}</text>
    <rect x="16" y="370" width="328" height="34" rx="9" fill="rgba(255,255,255,.04)"/><text x="28" y="392">rclone</text><text x="92" y="392" font-weight="500" fill="#98A1AC">{{rcloneShort}}</text>
    <rect x="16" y="410" width="328" height="26" rx="9" fill="none"/><text x="28" y="428" font-size="11.5" font-weight="500" fill="#69717C">Web UI + API · :8080</text>
  </g>
  <g font-size="13" font-weight="600" fill="#EEF1F4">
    <rect x=".5" y="510.5" width="169" height="41" rx="10" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="14" y="536">{{localDisk}}</text>
    <rect x=".5" y="558.5" width="169" height="41" rx="10" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="14" y="584">Google Drive</text>
    <rect x=".5" y="606.5" width="169" height="41" rx="10" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="14" y="632">S3 · SMB · SFTP …</text>
    <rect x="190.5" y="510.5" width="169" height="41" rx="10" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="204" y="536">{{appsShort}}</text>
    <rect x="190.5" y="558.5" width="169" height="41" rx="10" fill="#13171B" stroke="rgba(255,255,255,.1)"/><text x="204" y="584">{{browser}}</text>
    <text x="204" y="624" font-size="11" font-weight="500" fill="#69717C">{{via}}</text>
  </g>
</svg>
