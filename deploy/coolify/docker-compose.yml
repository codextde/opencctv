# Public demo / gateway instance on Coolify (https://opencctv-demo.codext.de)
# Coolify: Docker Compose build pack, Base Directory "/deploy/coolify", Docker Compose Location "/docker-compose.yml".
# The build context is the repository root (../..). OPENCCTV_ADMIN_PASSWORD is required; it creates the admin
# account on first start only (later changes: opencctv reset-password admin <new> inside the container).
# Visitors can sign in read-only with demo / demo. WebRTC port 8555 is not published here (Coolify would route the
# domain to the first published port); players fall back to MSE/HLS over 8080.
services:
  opencctv:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_OPENCCTV_8080
      - TZ=Europe/Berlin
      - OPENCCTV_PORT=8080
      - OPENCCTV_PUBLIC_URL=${OPENCCTV_PUBLIC_URL:-https://opencctv-demo.codext.de}
      - OPENCCTV_DEMO=${OPENCCTV_DEMO:-1}
      - OPENCCTV_ADMIN_USER=${OPENCCTV_ADMIN_USER:-admin}
      - OPENCCTV_ADMIN_PASSWORD=${OPENCCTV_ADMIN_PASSWORD:?}
      - OPENCCTV_WEBRTC_CANDIDATES=${OPENCCTV_WEBRTC_CANDIDATES:-}
      - OPENCCTV_GOOGLE_CLIENT_ID=${OPENCCTV_GOOGLE_CLIENT_ID:-}
      - OPENCCTV_GOOGLE_CLIENT_SECRET=${OPENCCTV_GOOGLE_CLIENT_SECRET:-}
    expose:
      - "8080"
    volumes:
      - opencctv-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/opencctv", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  opencctv-data:
